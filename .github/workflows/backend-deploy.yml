name: Backend CI & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  REMOTE_PYTHON: python3.11
  DEPLOY_PATH: /srv/apps/songs-backend
  SYSTEMD_SERVICE: songs-backend
  REPO_URL: git@github.com:YanMakarov/songs-backend.git

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Bytecode/typing smoke check
        run: python -m compileall app

      # The access policy is the one thing here that fails silently: a route
      # left open answers 200 and nothing looks wrong until someone reads it
      # over the internet. `deploy` needs this job, so a failure stops the
      # release rather than being reported after it.
      - name: Tests
        run: python -m pytest -q

      # The layering is the other thing that fails silently: a shortcut import
      # costs nothing today and is what the structure erodes into over a year.
      - name: Import contracts
        run: lint-imports

  deploy:
    needs: backend-ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BACKEND_SSH_KEY }}

      - name: Add remote host to known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.BACKEND_SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.BACKEND_SSH_PORT }}
        run: |
          if [ -z "${DEPLOY_HOST}" ]; then
            echo "Secret BACKEND_SSH_HOST is required" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${DEPLOY_PORT:-22}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Update server repo and restart service
        env:
          DEPLOY_HOST: ${{ secrets.BACKEND_SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.BACKEND_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.BACKEND_SSH_USER }}
          REMOTE_PYTHON: ${{ env.REMOTE_PYTHON }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          SYSTEMD_SERVICE: ${{ env.SYSTEMD_SERVICE }}
        run: |
          if [ -z "${DEPLOY_HOST}" ] || [ -z "${DEPLOY_USER}" ]; then
            echo "BACKEND_SSH_HOST and BACKEND_SSH_USER secrets are required" >&2
            exit 1
          fi
          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "REMOTE_PYTHON='${REMOTE_PYTHON}' DEPLOY_PATH='${DEPLOY_PATH}' SYSTEMD_SERVICE='${SYSTEMD_SERVICE}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          if [ ! -d .git ]; then
            echo "$DEPLOY_PATH is not a git repository" >&2
            exit 1
          fi
          git fetch --prune origin main
          git checkout main
          git reset --hard origin/main
          REMOTE_VENV="$DEPLOY_PATH/.venv"
          if [ ! -d "$REMOTE_VENV" ]; then
            "$REMOTE_PYTHON" -m venv "$REMOTE_VENV"
          fi
          "$REMOTE_VENV/bin/pip" install --upgrade pip wheel setuptools
          "$REMOTE_VENV/bin/pip" install -e .
          sudo cp "$DEPLOY_PATH/deploy/songs-backend.service" /etc/systemd/system/
          sudo systemctl daemon-reload
          sudo systemctl restart "$SYSTEMD_SERVICE"
          sudo systemctl --no-pager status "$SYSTEMD_SERVICE"
          REMOTE
