[project]
name = "songs-backend"
version = "0.1.0"
description = "FastAPI backend for the songs editor"
authors = [{ name = "songs" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111,<0.112",
  "uvicorn[standard]>=0.29,<0.30",
  "sqlmodel>=0.0.16,<0.0.17",
  "pdfminer.six>=20231228",
  # Three-way merge of song bodies (roadmap phase 4). Pure Python, no deps.
  "merge3>=0.0.15",
  # Password hashing. Argon2id is the current recommendation, and
  # argon2-cffi is maintained — unlike passlib, which has been dormant
  # for years and would only add a wrapper layer over the same binding.
  "argon2-cffi>=23.1",
]

[project.optional-dependencies]
# Not installed on the server: the deploy workflow runs `pip install -e .`
# without extras, so the test-only dependencies stay off production.
dev = [
  "pytest>=8",
  # TestClient's transport. Already present as a FastAPI extra, pinned here
  # so a bare `pip install -e .[dev]` is enough to run the suite.
  "httpx>=0.27",
  # Enforces the layering described under [tool.importlinter] below. Run as
  # `lint-imports`; the structure stops being real the day nothing checks it.
  "import-linter>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `app` is imported from the backend directory, which is also where the
# default DATABASE_URL resolves from.
pythonpath = ["."]
filterwarnings = [
  # SQLModel's own default factories call it, so this fires from library code
  # on every model instantiation and would bury real warnings.
  "ignore:datetime.datetime.utcnow\\(\\) is deprecated.*:DeprecationWarning",
  # FastAPI 0.111 still uses on_event internally for the app's own startup.
  "ignore:(?s).*on_event is deprecated.*:DeprecationWarning",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.uvicorn]
factory = false
reload = true


# --- Import contracts ------------------------------------------------------
#
# The module structure is only real while the import direction holds. Written
# down in a comment it survives about three weeks; written down here it fails
# `lint-imports` instead. The frontend enforces the same four layers in
# eslint.config.js — this is the backend half of the same rule.
#
#     app  ->  modules  ->  core  ->  shared
#
# Every arrow points one way. A module may reach another module, but only
# through its package root — the deep path is what turns "pdf uses a song
# line" into "pdf depends on every file the songs module happens to contain
# today".
#
# Run it with:  lint-imports
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Layers point one way"
type = "layers"
layers = ["app.main : app.cli : app.tables", "app.modules", "app.core", "app.shared"]
# `app` itself is the package __init__, which imports main on purpose.
exhaustive = false

[[tool.importlinter.contracts]]
name = "shared/ knows nothing about the app"
type = "forbidden"
source_modules = ["app.shared"]
forbidden_modules = ["app.core", "app.modules", "app.main", "app.cli", "app.tables"]

[[tool.importlinter.contracts]]
name = "core/ is infrastructure, not a feature"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.modules", "app.main", "app.cli", "app.tables"]

[[tool.importlinter.contracts]]
name = "A module must not reach up into the app layer"
type = "forbidden"
source_modules = ["app.modules"]
forbidden_modules = ["app.main", "app.cli", "app.tables"]

# One contract per module: its own files by path, every other module by front
# door only. `app.modules.<name>` stays allowed — `app.modules.<name>.**` does
# not.
[[tool.importlinter.contracts]]
name = "songs is used through its public API"
type = "forbidden"
source_modules = ["app.modules.auth", "app.modules.pdf", "app.modules.shapes"]
forbidden_modules = ["app.modules.songs.*", "app.modules.songs.**"]
# A front door that re-exports its own internals is the point, not a breach:
# only the import written in the file is checked.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "auth is used through its public API"
type = "forbidden"
source_modules = ["app.modules.songs", "app.modules.pdf", "app.modules.shapes"]
forbidden_modules = ["app.modules.auth.*", "app.modules.auth.**"]
# A front door that re-exports its own internals is the point, not a breach:
# only the import written in the file is checked.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "shapes is used through its public API"
type = "forbidden"
source_modules = ["app.modules.songs", "app.modules.auth", "app.modules.pdf"]
forbidden_modules = ["app.modules.shapes.*", "app.modules.shapes.**"]
# A front door that re-exports its own internals is the point, not a breach:
# only the import written in the file is checked.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "pdf is used through its public API"
type = "forbidden"
source_modules = ["app.modules.songs", "app.modules.auth", "app.modules.shapes"]
forbidden_modules = ["app.modules.pdf.*", "app.modules.pdf.**"]
# A front door that re-exports its own internals is the point, not a breach:
# only the import written in the file is checked.
allow_indirect_imports = true
